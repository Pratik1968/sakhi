name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Phones only; drop x86/x86_64 (emulator ABIs) to keep the build fast and the APK small.
      ANDROID_ABIS: armeabi-v7a,arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # The committed .env points at localhost, which is useless on a real device.
      # Set the EXPO_PUBLIC_API_URL repository variable to bake in the deployed backend.
      - name: Configure API URL
        env:
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
          else
            echo "::warning::EXPO_PUBLIC_API_URL repository variable is not set; the APK will use the value from .env"
          fi

      # android/ is gitignored (CNG), so generate it from app.json.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(assembleRelease --no-daemon "-PreactNativeArchitectures=$ANDROID_ABIS")
          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            args+=(
              "-Pandroid.injected.signing.store.file=$keystore"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK is signed with the debug keystore"
          fi
          ./gradlew "${args[@]}"

      - name: Rename APK
        id: apk
        run: |
          name="sakhi-${GITHUB_REF_NAME//\//-}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" --generate-notes
